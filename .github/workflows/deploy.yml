name: Deploy to GitHub Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
          BASE_PATCH=$(echo "$BASE" | cut -d. -f3)
          VERSION_COMMIT=$(git log -1 --format=%H -- VERSION)
          if [ -z "$VERSION_COMMIT" ]; then
            COMMITS_SINCE=0
          else
            COMMITS_SINCE=$(git rev-list "${VERSION_COMMIT}..HEAD" --count)
          fi
          PATCH=$((BASE_PATCH + COMMITS_SINCE))
          VERSION="${MAJOR_MINOR}.${PATCH}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: v$VERSION"

      - name: Build site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sed -i "s/__VERSION__/${{ steps.version.outputs.version }}/g" _site/index.html

      - name: Determine destination
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "dest_dir=" >> "$GITHUB_OUTPUT"
            echo "env_name=production" >> "$GITHUB_OUTPUT"
          else
            echo "dest_dir=staging" >> "$GITHUB_OUTPUT"
            echo "env_name=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          destination_dir: ${{ steps.target.outputs.dest_dir }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy ${{ steps.target.outputs.env_name }} v${{ steps.version.outputs.version }} from ${{ github.sha }}'
