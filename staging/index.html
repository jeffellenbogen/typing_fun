<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Typing Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Comic Sans MS','Chalkboard SE',cursive;width:100vw;height:100vh;overflow:hidden;background:#1a0a2e}
#startScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:200;background:linear-gradient(160deg,#0d0520 0%,#1a0a2e 40%,#4a1942 70%,#c96b3a 100%)}
#startScreen h1{font-size:clamp(1.8rem,5vw,3rem);color:#fff;text-shadow:0 0 40px rgba(255,180,100,.7),2px 2px 0 #a0336a;letter-spacing:3px}
#startScreen p{color:#f0c0e0;font-size:1rem}

#hodCard{background:rgba(0,0,0,.45);border:1.5px solid rgba(255,220,80,.3);border-radius:16px;
  padding:16px 28px;width:clamp(280px,70vw,420px);backdrop-filter:blur(6px)}
.hodTitle{color:#ffe066;font-size:1rem;font-weight:bold;text-align:center;margin-bottom:12px;letter-spacing:1px}
.hodRow{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.hodTheme{color:#f0c0e0;font-size:.95rem}
.hodDetail{color:#fff;font-size:.92rem;opacity:.9}
.hodDivider{border-top:1px solid rgba(255,255,255,.15);margin:10px 0}
.hodTotal{font-weight:bold}
.hodTotal span:first-child{color:#f0c0e0;font-size:1rem}
#hodTotal{color:#ffe066;font-size:1.05rem}
.themeBtn{padding:18px 40px;border:none;border-radius:50px;font-family:inherit;font-size:1.4rem;cursor:pointer;transition:transform .15s;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.themeBtn:hover{transform:scale(1.07)}
.cloudBtn{background:linear-gradient(135deg,#c0e8ff,#f0e0ff);color:#5a3a8a}
.soupBtn{background:linear-gradient(135deg,#c0392b,#e07830);color:#fff}
#hud{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#levelLabel{font-size:.95rem;color:#fff;font-weight:bold;min-width:70px}
#progressWrap{flex:1;margin:0 12px;height:12px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
#progressBar{height:100%;background:linear-gradient(90deg,#f9ca24,#f0932b);border-radius:99px;transition:width .4s}
#hudRight{display:flex;align-items:center;gap:10px}
#hudScore{color:#ffe066;font-weight:bold;font-size:.95rem;min-width:80px;text-align:right}
#soundToggle,#menuBtn{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 12px;font-size:.82rem;cursor:pointer;font-family:inherit;color:#fff}
#menuBtn{background:rgba(255,100,100,.2);border-color:rgba(255,150,150,.4)}
#gameCanvas{position:absolute;top:46px;left:0;width:100%;display:block}
#playArea{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12px;gap:8px;z-index:20}
#wordPrompt{font-size:clamp(.9rem,2.5vw,1.2rem);color:rgba(255,255,255,.9);letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#slots{display:flex;gap:10px}
.slot{width:clamp(44px,8vw,68px);height:clamp(44px,8vw,68px);border-bottom:4px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:clamp(1.5rem,4.5vw,2.4rem);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.slot.correct{color:#7eff9c;border-bottom-color:#7eff9c}
.slot.shake{animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-7px)}70%{transform:translateX(7px)}}
#keyboard{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;z-index:60}
.krow{display:flex;gap:4px}
.key{border-radius:7px;border:none;background:rgba(255,255,255,.18);box-shadow:0 3px 0 rgba(0,0,0,.4);font-family:inherit;font-weight:bold;color:#fff;cursor:pointer;transition:background .12s,transform .08s}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.key.highlight{background:rgba(249,202,36,.92);color:#333;box-shadow:0 3px 0 #b8860b,0 0 16px rgba(249,202,36,.7)}
.key.wrong{background:rgba(220,50,50,.92)!important;color:#fff!important;box-shadow:0 3px 0 #8b0000,0 0 16px rgba(220,50,50,.7)!important}
#levelComplete,#allDone{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.6);z-index:90}
#levelComplete.show,#allDone.show{display:flex}
#levelComplete h2,#allDone h2{font-size:clamp(1.6rem,5vw,2.8rem);color:#f9ca24;text-shadow:2px 2px 0 #b8860b;text-align:center}
.panelScore{color:#ffe066;font-size:1.2rem;font-weight:bold}
.bigBtn{padding:14px 38px;border:none;border-radius:50px;font-family:inherit;font-size:1.2rem;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.3);margin:4px}
#nextBtn{background:#27ae60;color:#fff}
#restartBtn{background:#8e44ad;color:#fff}
.menuBtnBig{background:rgba(255,255,255,.15);color:#fff;border:2px solid rgba(255,255,255,.3)}
#versionDisplay{position:fixed;bottom:4px;right:8px;font-family:'Courier New',monospace;font-size:10px;color:rgba(255,255,255,.45);text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:999;pointer-events:none;letter-spacing:.5px}
</style>
</head>
<body>
<div id="startScreen">
  <h1>✨ Typing Adventure ✨</h1>

  <!-- HUD card -->
  <div id="hodCard">
    <div class="hodTitle">📊 Your Progress</div>
    <div class="hodRow">
      <span class="hodTheme">☁️ Cloud</span>
      <span class="hodDetail" id="hodCloud">Level 1 &nbsp;·&nbsp; ⭐ 0 pts</span>
    </div>
    <div class="hodRow">
      <span class="hodTheme">🍜 Soup</span>
      <span class="hodDetail" id="hodSoup">Level 1 &nbsp;·&nbsp; ⭐ 0 pts</span>
    </div>
    <div class="hodDivider"></div>
    <div class="hodRow hodTotal">
      <span>Total Score</span>
      <span id="hodTotal">⭐ 0</span>
    </div>
  </div>

  <p>Choose your world!</p>
  <button class="themeBtn cloudBtn" onclick="startGame('cloud')">☁️ Cloud Letters</button>
  <button class="themeBtn soupBtn" onclick="startGame('soup')">🍜 Alphabet Soup</button>
</div>
<div id="hud" style="display:none">
  <div id="levelLabel">Level 1</div>
  <div id="progressWrap"><div id="progressBar" style="width:0%"></div></div>
  <div id="hudRight">
    <div id="hudScore">⭐ 0</div>
    <button id="soundToggle" onclick="toggleSound()">🔊</button>
    <button id="menuBtn" onclick="goMenu()">Menu</button>
  </div>
</div>
<canvas id="gameCanvas" style="display:none"></canvas>
<div id="playArea" style="display:none">
  <div id="wordPrompt">Type the word!</div>
  <div id="slots"></div>
</div>
<div id="keyboard" style="display:none">
  <div class="krow" id="row1"></div>
  <div class="krow" id="row2"></div>
  <div class="krow" id="row3"></div>
</div>
<div id="levelComplete">
  <h2 id="levelCompleteMsg"></h2>
  <div class="panelScore" id="lcScore"></div>
  <div>
    <button class="bigBtn" id="nextBtn" onclick="nextLevel()">Next Level ➡️</button>
    <button class="bigBtn menuBtnBig" onclick="goMenu()">☰ Menu</button>
  </div>
</div>
<div id="allDone">
  <h2>🏆 Amazing! You finished! 🏆</h2>
  <div class="panelScore" id="adScore"></div>
  <div>
    <button class="bigBtn" id="restartBtn" onclick="location.reload()">Play Again 🔄</button>
    <button class="bigBtn menuBtnBig" onclick="goMenu()">☰ Menu</button>
  </div>
</div>

<script>
// ── WORD LISTS ──
const LEVELS=[
  shuffle(['cat','dog','sun','hat','bug','cup','pig','hen','bee','bat','mud','jam','fox','web','big','map','gem','yam','elf','peg','cub','top','leg','tap','dig','hop','red','bed','wig','nap','jet','zip','log','mop','fin','van','box','jug','yak','den']),
  shuffle(['cake','bike','bird','boat','book','duck','fish','frog','game','gate','gift','glad','goat','gold','good','grab','grin','help','hill','hold','home','hope','jump','kick','kind','king','kite','lamp','land','leaf','lion','lock','loop','love','luck','moon','more','move','nest','next','nine','nose','open','park','play','plus','pond','pool','pull','push','race','rain','read','ride','ring','road','rock','roof','rope','rose','rule','rush','safe','sail','sand','seed','ship','shop','sing','sink','skip','sled','slip','slow','snap','snow','sock','soft','song','sort','soup','spin','spot','star','stay','step','stop','swim','tail','tall','tent','time','toad','toss','tree','trip','true','twig','twin','wave','went','west','wide','wild','will','wind','wing','wish','wolf','worm','yard','year','zoom']),
  shuffle(['also','army','baby','back','ball','band','base','bath','bead','beam','bean','bear','beat','bell','belt','bend','best','bite','blow','blue','bold','bone','born','both','bake','burn','byte','call','calm','came','cape','card','care','cart','cast','cave','cell','cent','chin','chip','chop','city','clam','clap','clay','clip','club','clue','coal','coat','code','coil','coin','cold','colt','copy','cord','core','corn','cost','cozy','crab','crop','crow','cure','curl','cute','damp','dare','dark','dart','dash','data','date','dawn','dead','deal','dear','deck','deep','dent','desk','diet','dirt','dish','disk','dive','dome','done','door','dose','draw','drum','dune','dusk','dust','earn','ease','east','edge','even','ever','evil','face','fact','fail','fair','fall','fame','farm','fast','fate','fear','feat','feed','feel','fern'])
];
const PRAISE=['⭐ Great job!','🌟 Awesome!','✨ Wow!','💛 Perfect!','🎉 Yes!','🔥 Amazing!','👏 Brilliant!'];
const ROWS=[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m']];

// ── ALL GLOBALS ──
var theme='cloud',soundOn=true,level=0,wordList=[],wordIdx=0;
var currentWord='',typedIdx=0,particles=[],animId=null,ctx=null,canvas=null,coalescing=false;
var score=0,audioCtx=null,keyH=0,playH=0;
var bowlX=0,bowlY=0,bowlRX=0,bowlRY=0;
var bgCanvas=null,bgCtx=null,bgValid=false;
var successBanner={active:false,text:'',pts:'',alpha:0,timer:0};
var cloudProgress={level:0,wordIdx:0,wordList:null};
var soupProgress={level:0,wordIdx:0,wordList:null};
var gameRunning=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rnd(a,b){return a+Math.random()*(b-a)}

// ── PROGRESS PERSISTENCE ──
function getProgress(){return theme==='cloud'?cloudProgress:soupProgress}
function setProgress(obj){if(theme==='cloud')cloudProgress=obj;else soupProgress=obj}
function saveState(){
  try{sessionStorage.setItem('typingGame',JSON.stringify({score,progress_cloud:cloudProgress,progress_soup:soupProgress}))}catch(e){}
}
function loadState(){
  try{
    const raw=sessionStorage.getItem('typingGame');if(!raw)return;
    const s=JSON.parse(raw);
    score=s.score||0;
    if(s.progress_cloud)cloudProgress=s.progress_cloud;
    if(s.progress_soup)soupProgress=s.progress_soup;
  }catch(e){}
}

// ── AUDIO ──
function getAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function tone(f,d,t,v){if(!soundOn)return;d=d||.08;t=t||'sine';v=v||.16;try{const a=getAudio(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function playSuccess(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){tone(f,.38,'sine',.13)},i*100)})}
function playWrong(){tone(180,.13,'triangle',.1)}
function playKey(){tone(700,.04,'sine',.07)}

// ── UI HELPERS ──
var cloudScore=0,soupScore=0;

function getThemeScore(){return theme==='cloud'?cloudScore:soupScore}
function addThemeScore(pts){if(theme==='cloud')cloudScore+=pts;else soupScore+=pts}

function updateScoreUI(){
  var el=document.getElementById('hudScore');if(el)el.textContent='⭐ '+score;
  updateHOD();
}

function updateHOD(){
  var cp=cloudProgress,sp=soupProgress;
  var cLevel=Math.min((cp.level||0)+1, LEVELS.length);
  var sLevel=Math.min((sp.level||0)+1, LEVELS.length);
  var hc=document.getElementById('hodCloud');
  var hs=document.getElementById('hodSoup');
  var ht=document.getElementById('hodTotal');
  if(hc)hc.innerHTML='Level '+cLevel+'&nbsp;&middot;&nbsp; ⭐ '+cloudScore+' pts';
  if(hs)hs.innerHTML='Level '+sLevel+'&nbsp;&middot;&nbsp; ⭐ '+soupScore+' pts';
  if(ht)ht.textContent='⭐ '+score;
}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊':'🔇'}

function goMenu(){
  var prog=getProgress();
  prog.level=level;prog.wordIdx=wordIdx;prog.wordList=wordList.slice();
  setProgress(prog);saveState();
  gameRunning=false;
  cancelAnimationFrame(animId);animId=null;
  ['hud','gameCanvas','playArea','keyboard'].forEach(function(id){document.getElementById(id).style.display='none'});
  ['levelComplete','allDone'].forEach(function(id){document.getElementById(id).classList.remove('show')});
  successBanner.active=false;
  document.getElementById('startScreen').style.display='flex';
  updateScoreUI();
}

// ── KEYBOARD ──
function buildKeyboard(){
  ROWS.forEach(function(row,ri){
    var el=document.getElementById('row'+(ri+1));el.innerHTML='';
    row.forEach(function(k){
      var b=document.createElement('button');b.className='key';b.id='key_'+k;
      b.textContent=k.toUpperCase();
      b.addEventListener('click',function(){handleKey(k)});
      el.appendChild(b);
    });
  });
}
function highlightKey(l){
  document.querySelectorAll('.key').forEach(function(k){k.classList.remove('highlight')});
  if(l){var e=document.getElementById('key_'+l);if(e)e.classList.add('highlight')}
}
function flashRedKey(k){
  var el=document.getElementById('key_'+k);if(!el)return;
  el.classList.add('wrong');
  setTimeout(function(){el.classList.remove('wrong')},400);
}
function sizeKeyboard(){
  var vw=window.innerWidth,vh=window.innerHeight,hudH=46;
  keyH=Math.min((vh-hudH)*.27,160);
  document.getElementById('keyboard').style.bottom=(keyH*.04)+'px';
  var kSize=Math.min(Math.floor(vw/11.5),Math.floor(keyH/3.3));
  var fs=Math.max(10,Math.floor(kSize*.44));
  document.querySelectorAll('.key').forEach(function(k){k.style.width=kSize+'px';k.style.height=Math.floor(kSize*1.1)+'px';k.style.fontSize=fs+'px'});
  playH=keyH+10;
  var pa=document.getElementById('playArea');pa.style.bottom=playH+'px';pa.style.top='46px';
}

// ── GAME INIT ──
function startGame(t){
  theme=t;bgValid=false;gameRunning=true;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('playArea').style.display='flex';
  document.getElementById('keyboard').style.display='flex';
  canvas=document.getElementById('gameCanvas');canvas.style.display='block';
  ctx=canvas.getContext('2d');
  buildKeyboard();sizeKeyboard();resizeCanvas();
  // Restore saved progress for this theme
  var prog=getProgress();
  level=prog.level||0;
  if(prog.wordList&&prog.wordList.length>0){
    wordList=prog.wordList;wordIdx=prog.wordIdx||0;
    if(wordIdx>=wordList.length){wordIdx=0;wordList=shuffle(LEVELS[level].slice()).slice(0,12)}
  }else{
    wordList=shuffle(LEVELS[level].slice()).slice(0,12);wordIdx=0;
  }
  document.getElementById('levelLabel').textContent='Level '+(level+1);
  updateProgress();loadWord();
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function resizeCanvas(){
  var hudH=46,h=window.innerHeight-hudH;
  canvas.style.top=hudH+'px';canvas.style.left='0';canvas.style.width='100%';canvas.style.height=h+'px';
  canvas.width=window.innerWidth;canvas.height=h;bgValid=false;
}

// ── KEYDOWN (added once at boot) ──
document.addEventListener('keydown',function(e){
  if(!gameRunning)return;
  if(coalescing)return;
  if(e.key.length===1&&/[a-z]/i.test(e.key))handleKey(e.key.toLowerCase());
});
window.addEventListener('resize',function(){
  if(!gameRunning||!canvas)return;
  sizeKeyboard();resizeCanvas();
});

// ── GAME FLOW ──
function loadLevel(){
  document.getElementById('levelLabel').textContent='Level '+(level+1);
  wordList=shuffle(LEVELS[level].slice()).slice(0,12);wordIdx=0;updateProgress();loadWord();saveState();
}
function loadWord(){
  coalescing=false;currentWord=wordList[wordIdx];typedIdx=0;particles=[];
  if(theme==='soup')computeBowlGeometry(canvas.width,canvas.height);
  spawnParticles();renderSlots();highlightKey(currentWord[0]);updateProgress();
}
function updateProgress(){document.getElementById('progressBar').style.width=(wordIdx/wordList.length*100)+'%'}

function renderSlots(){
  var el=document.getElementById('slots');el.innerHTML='';
  for(var i=0;i<currentWord.length;i++){
    var d=document.createElement('div');d.className='slot'+(i<typedIdx?' correct':'');
    d.id='slot'+i;d.textContent=i<typedIdx?currentWord[i].toUpperCase():'';el.appendChild(d);
  }
}
function shakeSlot(i){var s=document.getElementById('slot'+i);if(!s)return;s.classList.add('shake');setTimeout(function(){s.classList.remove('shake')},300)}

function handleKey(k){
  if(!gameRunning||coalescing)return;
  if(k===currentWord[typedIdx]){
    playKey();
    var p=null;
    for(var i=0;i<particles.length;i++){if(!particles[i].typed&&particles[i].letter===currentWord[typedIdx]){p=particles[i];break}}
    if(p)p.typed=true;
    typedIdx++;renderSlots();
    if(typedIdx===currentWord.length){highlightKey(null);setTimeout(onWordComplete,200)}
    else highlightKey(currentWord[typedIdx]);
  }else{
    playWrong();shakeSlot(typedIdx);flashRedKey(k);
    // Flash the target noodle red
    for(var i=0;i<particles.length;i++){if(!particles[i].typed&&particles[i].letter===currentWord[typedIdx]){particles[i].wrongFlash=true;(function(pp){setTimeout(function(){pp.wrongFlash=false},400)})(particles[i]);break}}
  }
}

function wordScore(){return currentWord.length===3?10*(level+1):15*(level+1)}

function onWordComplete(){
  coalescing=true;
  var pts=wordScore();score+=pts;addThemeScore(pts);updateScoreUI();saveState();playSuccess();
  var n=currentWord.length;
  setTimeout(function(){
    showSuccessBanner(PRAISE[Math.floor(Math.random()*PRAISE.length)],'+'+pts+' points!');
  },(n-1)*80+600);
  coalesceParticles(function(){dissipateParticles(function(){
    wordIdx++;updateProgress();
    if(wordIdx>=wordList.length)setTimeout(onLevelComplete,300);else loadWord();
  })});
}

function onLevelComplete(){
  if(level>=LEVELS.length-1){
    document.getElementById('adScore').textContent='Final Score: ⭐ '+score;
    document.getElementById('allDone').classList.add('show');
  }else{
    document.getElementById('levelCompleteMsg').textContent=level===0?'🎉 Level 1 Complete!':'🌟 Level 2 Complete!';
    document.getElementById('lcScore').textContent='Score so far: ⭐ '+score;
    document.getElementById('levelComplete').classList.add('show');
  }
}
function nextLevel(){
  document.getElementById('levelComplete').classList.remove('show');
  level++;
  var prog=getProgress();prog.level=level;prog.wordIdx=0;prog.wordList=null;setProgress(prog);
  saveState();
  document.getElementById('levelLabel').textContent='Level '+(level+1);
  loadLevel();
}

// ── PARTICLES ──
function computeBowlGeometry(W,H){
  bowlX=W/2;bowlY=H*.46;var br=Math.min(W,H)*.33;bowlRX=br*.84;bowlRY=br*.67;
}
function randInBowl(){
  for(var i=0;i<60;i++){
    var x=bowlX+rnd(-bowlRX*.82,bowlRX*.82),y=bowlY+rnd(-bowlRY*.78,bowlRY*.78);
    if(inBowl(x,y))return{x:x,y:y};
  }
  return{x:bowlX,y:bowlY};
}
function inBowl(x,y){var dx=(x-bowlX)/bowlRX,dy=(y-bowlY)/bowlRY;return dx*dx+dy*dy<=0.84}

function spawnParticles(){
  var W=canvas.width,H=canvas.height,safeB=H-playH-50;
  currentWord.split('').forEach(function(letter,li){
    var x,y;
    if(theme==='soup'){var p=randInBowl();x=p.x;y=p.y}
    else{x=rnd(W*.1,W*.9);y=rnd(H*.07,Math.min(safeB,H*.74))}
    particles.push({letter:letter,idx:li,x:x,y:y,vx:rnd(-.3,.3),vy:rnd(-.2,.2),size:rnd(52,68),typed:false,alpha:1,phase:Math.random()*Math.PI*2,coalescing:false,tx:0,ty:0,dissipating:false,wobble:Math.random()*Math.PI*2,wrongFlash:false});
  });
}

function coalesceParticles(cb){
  var W=canvas.width,n=currentWord.length;
  var spacing=Math.min(108,W*.15);
  var sx=W/2-(n-1)*spacing/2,ty=theme==='soup'?bowlY:canvas.height*.38;
  particles.forEach(function(p,i){
    setTimeout(function(){p.coalescing=true;p.tx=sx+p.idx*spacing;p.ty=ty},p.idx*80);
  });
  setTimeout(cb,(n-1)*80+900);
}
function dissipateParticles(cb){particles.forEach(function(p){p.dissipating=true});setTimeout(cb,900)}

// ── SUCCESS BANNER (drawn on canvas) ──
function showSuccessBanner(text,pts){
  successBanner={active:true,text:text,pts:pts,alpha:1,timer:120};
}
function drawSuccessBanner(W){
  if(!successBanner.active)return;
  successBanner.timer--;
  if(successBanner.timer<=30)successBanner.alpha=successBanner.timer/30;

// ── MAIN LOOP ──
function loop(){
  var W=canvas.width,H=canvas.height;
  if(!W||!H){animId=requestAnimationFrame(loop);return}
  ctx.clearRect(0,0,W,H);
  var t=Date.now()/1000;
  ensureBg(W,H);ctx.drawImage(bgCanvas,0,0);
  var nextLetter=coalescing?null:currentWord[typedIdx];
  particles.forEach(function(p){
    if(p.dissipating){
      p.alpha-=.022;
      if(theme==='soup'){p.vy+=.018;p.size-=.25}else{p.vy-=.018;p.size+=.35}
    }else if(p.coalescing){
      p.x+=(p.tx-p.x)*.08;p.y+=(p.ty-p.y)*.08;
    }else{
      p.x+=p.vx;p.y+=p.vy+Math.sin(t+p.phase)*.2;
      if(theme==='soup'){
        var dx=(p.x-bowlX)/bowlRX,dy=(p.y-bowlY)/bowlRY,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist>0.88){
          var inwardAngle=Math.atan2(-dy,-dx)+rnd(-0.7,0.7);
          var spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
          var tx2=Math.cos(inwardAngle)*spd,ty2=Math.sin(inwardAngle)*spd;
          p.vx=p.vx*.85+tx2*.15;p.vy=p.vy*.85+ty2*.15;
          p.x=bowlX+(dx/dist)*bowlRX*.86;p.y=bowlY+(dy/dist)*bowlRY*.86;
        }
        p.vx*=.998;p.vy*=.998;
        particles.forEach(function(other){
          if(other===p||other.dissipating)return;
          var ex=p.x-other.x,ey=p.y-other.y,edist=Math.sqrt(ex*ex+ey*ey);
          var minDist=(p.size+other.size)*.55;
          if(edist<minDist&&edist>0){var force=(minDist-edist)/minDist*.06;p.vx+=ex/edist*force;p.vy+=ey/edist*force}
        });
      }else{
        var safeB=H-playH-50;
        if(p.x<80||p.x>W-80)p.vx*=-1;
        if(p.y<30||p.y>safeB)p.vy*=-1;
      }
    }
    if(p.alpha<=0)return;
    ctx.save();ctx.globalAlpha=Math.max(0,p.alpha);
    var isNext=!p.typed&&p.letter===nextLetter;
    if(theme==='cloud')drawCloudLetter(p,isNext);
    else drawNoodleLetter(p,t,isNext);
    ctx.restore();
  });
  drawSuccessBanner(W);
  animId=requestAnimationFrame(loop);
}

// ── BOOT ──
loadState();
updateScoreUI();
